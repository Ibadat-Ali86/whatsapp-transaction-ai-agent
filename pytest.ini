[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --tb=short
    --strict-markers
    -v
markers =
    unit: Pure unit tests — no I/O
    integration: Tests requiring real infrastructure
    accuracy: OCR accuracy benchmark tests
    slow: Tests that take more than 1 second
